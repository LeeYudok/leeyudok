# 저장소 자체의 보조 형식입니다. 특정 에이전트 도구의 설정 스키마가 아닙니다.
schema_version: 1
repository:
  name: LeeYudok/leeyudok
  kind: github-profile
  primary_language: ko
  purpose: 실제 작업 분야와 공개 프로젝트를 쉽게 이해하고 찾을 수 있는 프로필 소개
files:
  profile: README.md
  authoritative_instructions: AGENTS.md
  structured_companion: AGENTS.yaml
scope: entire_repository
focus_areas:
  - 백엔드 개발 / Backend development
  - 자체 호스팅 인프라 / Self-hosted infrastructure
  - AI 코딩 에이전트 / AI coding agents
  - 개발 자동화 / Developer tools
content_rules:
  - 한국어를 기본으로 쓰고 기술명과 프로젝트명의 공식 표기를 유지한다.
  - 실제 작업 분야를 첫 소개에서 명확히 설명한다.
  - 공개 프로젝트는 링크, 해결하는 문제, 주요 기술을 짧게 설명한다.
  - 실제 작업과 관련된 검색어를 자연스럽게 쓰고 반복 나열하지 않는다.
  - 약어와 영어 설명은 독자의 이해에 필요한 만큼 사용한다.
  - 기존 소개와 사용자 제공 사실을 근거로 쓰고 새 사실은 확인한다.
  - 확인되지 않은 경력, 소속, 고객사, 자격, 성과 수치, 기능을 만들지 않는다.
  - 검색 순위나 노출을 보장하지 않는다.
  - 공개 프로젝트와 비공개 운영 작업을 구분한다.
  - 비공개 주소나 접근 정보를 추가하지 않는다.
  - 관련 변경 요청이 없으면 기존 프로젝트 링크와 조회수 배지를 유지한다.
validation:
  - README 문장과 링크 및 배지 Markdown을 검토한다.
  - git diff --check
  - YAML 변경 시 사용 가능한 YAML 파서로 문법을 확인한다.
  - 목적과 규칙 변경 시 AGENTS.md와 AGENTS.yaml을 동기화한다.
  - 규칙 충돌 시 AGENTS.md를 기준으로 보조 자료를 수정한다.
  - 문서 확인을 위해 애플리케이션 빌드나 테스트 도구를 도입하지 않는다.
